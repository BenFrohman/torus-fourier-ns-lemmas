name: Lean build and axiom audit (print-axioms table)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  axiom-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by lean-toolchain = leanprover/lean4:v4.30.0-rc1)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Axiom audit
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | awk '/^[ \t]/{sub(/^[ \t]+/," ");printf "%s",$0;next} NR>1{print ""} {printf "%s",$0} END{print ""}' | tee axioms.txt
      - name: Check axioms are standard only
        run: |
          test -s axioms.txt
          OK='depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$|does not depend on any axioms$'
          n=$(grep -c "^#print axioms" AxiomAudit.lean); m=$(grep -E "^'" axioms.txt | grep -cE "$OK" || true)
          echo "audited $n declarations, $m with standard axioms only"
          if [ "$n" -ne "$m" ] || grep -iE "error|warning: declaration uses" axioms.txt; then
            echo "Non-standard axiom output:"; cat axioms.txt; exit 1; fi
      - name: No sorry / no axiom declarations
        run: python3 scripts/check_no_sorry.py
