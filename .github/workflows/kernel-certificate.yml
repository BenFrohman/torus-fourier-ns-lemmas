name: Kernel certificate

# Rebuilds the development with its pinned toolchain, scans for sorry/admit/native_decide/axiom,
# runs collectAxioms (#print axioms) on every theorem the build produces, re-checks every module
# with Lean's external kernel checker (leanchecker / lean4checker), and uploads the raw logs.
# The committed copies of these files live in certificates/ (see certificates/CERTIFICATE.md).

on:
  push:
  workflow_dispatch:

jobs:
  kernel-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Toolchain and revision
        run: |
          mkdir -p cert-out
          {
            echo "commit: $(git rev-parse HEAD)"
            echo "lean-toolchain: $(cat lean-toolchain)"
            echo "lean --version: $(lean --version)"
            echo "lake --version: $(lake --version)"
            echo "date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee cert-out/environment.txt
      - name: Get Mathlib cache (never rebuilds Mathlib from source)
        run: |
          if grep -q '"name": *"mathlib"' lake-manifest.json 2>/dev/null; then lake exe cache get; else echo "no mathlib dependency"; fi
      - name: lake build
        run: |
          set -o pipefail
          lake build 2>&1 | tee cert-out/build.log
      - name: sorry / admit / native_decide / axiom scan
        run: |
          set -o pipefail
          python3 certificates/tools/sorry_scan.py 2>&1 | tee cert-out/sorry-scan.txt
      - name: '#print axioms (collectAxioms) for every theorem in the built modules'
        run: |
          set -o pipefail
          python3 certificates/tools/gen_audit.py cert-out/KernelCertificateAudit.lean cert-out/modules.txt
          lake env lean cert-out/KernelCertificateAudit.lean > cert-out/axioms.raw.txt 2>&1 || { cat cert-out/axioms.raw.txt; exit 1; }
          python3 certificates/tools/check_audit.py cert-out/axioms.raw.txt > cert-out/axioms.txt || { tail -50 cert-out/axioms.txt; exit 1; }
          tail -1 cert-out/axioms.txt
      - name: External kernel re-check of every module (leanchecker / lean4checker)
        run: |
          set -o pipefail
          LEANBIN="$(dirname "$(elan which lean)")"
          VER="$(sed 's/.*://' lean-toolchain | tr -d '[:space:]')"
          if [ -x "$LEANBIN/leanchecker" ]; then
            LC="$LEANBIN/leanchecker"; echo "checker: leanchecker shipped with $VER" > cert-out/leanchecker.txt
          elif git ls-remote --exit-code --tags https://github.com/leanprover/lean4checker "refs/tags/$VER" >/dev/null; then
            git clone -q --depth 1 --branch "$VER" https://github.com/leanprover/lean4checker /tmp/lean4checker
            (cd /tmp/lean4checker && lake build)
            LC="/tmp/lean4checker/.lake/build/bin/lean4checker"; echo "checker: lean4checker tag $VER ($(git -C /tmp/lean4checker rev-parse HEAD))" > cert-out/leanchecker.txt
          else
            echo "NOT RUN: no leanchecker in toolchain $VER and no lean4checker tag $VER" | tee cert-out/leanchecker.txt; exit 0
          fi
          fail=0
          while read -r m; do
            [ -n "$m" ] || continue
            if out=$(lake env "$LC" "$m" 2>&1); then echo "$m: OK" ; else echo "$m: FAILED"; echo "$out"; fail=1; fi
          done < cert-out/modules.txt | tee -a cert-out/leanchecker.txt
          if grep -q ': FAILED' cert-out/leanchecker.txt; then exit 1; fi
          echo "RESULT: $(grep -c ': OK$' cert-out/leanchecker.txt) modules re-checked, 0 failures" | tee -a cert-out/leanchecker.txt
      - name: Upload certificate files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-certificate
          path: cert-out/
